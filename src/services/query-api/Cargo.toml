[package]
name = "query-api"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../../control-plane/core" }
control-plane-postgres = { path = "../../control-plane/postgres" }
async-trait = "0.1"
axum = "0.7"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# Embedded DuckDB serving engine. `bundled` compiles DuckDB from source so no system
# lib is needed; this task verifies the bundled version loads loom's 1.5.3 ducklake extension.
duckdb = { version = "1", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
http-body-util = "0.1"
tower = "0.5"
