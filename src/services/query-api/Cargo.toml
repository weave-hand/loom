[package]
name = "query-api"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../../control-plane/core" }
engine-wire = { path = "../engine-wire" }
async-trait = "0.1"
axum = "0.7"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
# arrow 58 for IPC encode/decode (encode_ipc_stream, engine_client IPC decode).
arrow = "58"
# Pinned =0.3.47: time 0.3.48 adds a trait impl that conflicts with sqlx-core 0.9's
# blanket From<T> for Json<T> under Rust 2024 orphan rules, breaking the postgres
# build (control-plane-postgres is a transitive dep). `formatting`/`macros` features
# are already enabled workspace-wide; they render Date/Timestamp as ISO-8601.
time = { version = "=0.3.47", features = ["formatting", "macros"] }
# Subscriber installer for the binary. Declared as normal dep (not dev) so reindeer
# emits the //third-party:tracing-subscriber alias (reindeer skips dev-only in
# non-vendored mode).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs"] }
utoipa = "5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
http-body-util = "0.1"
tower = "0.5"
# Real HTTP client for the over-the-wire e2e smoke (http_wire_e2e). rustls-only,
# matching reqwest's already-resolved (transitive, via iceberg/parquet) feature set
# so exposing it pulls no native-tls/openssl edge.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
