syntax = "proto3";
package loom.engine.v1;

service EngineControl {
  rpc Dequeue      (DequeueRequest)      returns (DequeueResponse);
  rpc Complete     (CompleteRequest)     returns (CompleteResponse);
  rpc Fail         (FailRequest)         returns (FailResponse);
  rpc Heartbeat    (HeartbeatRequest)    returns (HeartbeatResponse);
  rpc AwaitJobs    (AwaitJobsRequest)    returns (AwaitJobsResponse);   // unary long-poll
  rpc FlushTable   (FlushTableRequest)   returns (FlushTableResponse);
  rpc GcTable      (GcTableRequest)      returns (GcTableResponse);
  rpc ListFiles    (ListFilesRequest)    returns (ListFilesResponse);
  rpc CompactTable (CompactTableRequest) returns (CompactTableResponse);
  rpc CommitTransform (CommitTransformRequest) returns (CommitTransformResponse);
  rpc MarkRunRunning  (MarkRunRunningRequest)  returns (MarkRunRunningResponse);
  rpc FinishRunFailed (FinishRunFailedRequest) returns (FinishRunFailedResponse);
  rpc BuildVectorIndex (BuildVectorIndexRequest) returns (BuildVectorIndexResponse);
  rpc WriteObject    (WriteObjectRequest)    returns (WriteObjectResponse);
  rpc WriteSteps     (WriteStepsRequest)     returns (WriteStepsResponse);
  rpc OverwriteTable (OverwriteTableRequest) returns (OverwriteTableResponse);
  rpc CurrentInlineVersion (CurrentInlineVersionRequest) returns (CurrentInlineVersionResponse);
  rpc WriteDelta           (WriteDeltaRequest)           returns (WriteDeltaResponse);
  // Governance reads (query-api reads ACL + ontology over the wire).
  rpc Check            (CheckRequest)            returns (CheckResponse);
  rpc PoliciesFor      (PoliciesForRequest)      returns (PoliciesForResponse);
  rpc GetType          (GetTypeRequest)          returns (GetTypeResponse);
  rpc Resolve          (ResolveRequest)          returns (ResolveResponse);
  rpc Links            (LinksRequest)            returns (LinksResponse);
  rpc LinksTo          (LinksToRequest)          returns (LinksToResponse);
  rpc ListTypes        (ListTypesRequest)        returns (ListTypesResponse);
  rpc ListActions      (ListActionsRequest)      returns (ListActionsResponse);
  rpc GetAction        (GetActionRequest)        returns (GetActionResponse);
  rpc VectorIndexesFor (VectorIndexesForRequest) returns (VectorIndexesForResponse);
  rpc GetVectorIndex   (GetVectorIndexRequest)   returns (GetVectorIndexResponse);
}

message Job {
  string id = 1;          // Uuid as string
  string kind = 2;
  string payload = 3;     // serde_json::Value as a JSON string
  int32  attempts = 4;
  int64  run_at = 5;      // unix microseconds
}
message DequeueRequest  { repeated string kinds = 1; string worker = 2; }
message DequeueResponse { optional Job job = 1; }     // absent = no job (NOT an error)

message CompleteRequest  { string id = 1; }   message CompleteResponse  {}
message HeartbeatRequest { string id = 1; }   message HeartbeatResponse {}

message FailRequest { string id = 1; string error = 2; RetryPolicy policy = 3; }
message RetryPolicy { oneof kind { int64 retry_delay_ms = 1; Abandon abandon = 2; } }
message Abandon {}
message FailResponse {}

message AwaitJobsRequest  { repeated string kinds = 1; uint64 timeout_ms = 2; }
message AwaitJobsResponse {}                            // returns on notify or timeout

message FlushTableRequest  { string schema = 1; string name = 2; }
message FlushTableResponse { optional int64 snapshot_id = 1; }   // absent = None

message GcTableRequest  { string schema = 1; string name = 2; }
message GcTableResponse { uint64 data_file_rows = 1; uint64 inline_rows = 2; uint64 objects_deleted = 3; }

message FileMeta { string path = 1; int64 record_count = 2; int64 file_size_bytes = 3; }
message ListFilesRequest  { string schema = 1; string name = 2; }
message ListFilesResponse {
  repeated FileMeta files = 1;
  // Declared schema (serde_json Vec<ColumnSpec>) at the current snapshot.
  // ABSENT <=> the table does not exist — the table-exists discriminator that
  // lets a zero-file table register as an empty relation.
  optional string columns_json = 2;
}
message CompactTableRequest  { string schema = 1; string name = 2; repeated string expire = 3; repeated string write_json = 4; }
message CompactTableResponse { optional int64 snapshot_id = 1; }

message CommitTransformRequest {
  string schema = 1;              // output TableRef
  string name = 2;
  string columns_json = 3;        // serde_json Vec<ColumnSpec> — inferred output schema
  repeated string write_json = 4; // one serde_json DataFile per written file
  string lineage_json = 5;        // serde_json LineageWire
  bool replace = 6;               // false = append_files; true = replace_files
  optional string run_id = 7;     // transform run to mark Succeeded once staged, if any
}
message CommitTransformResponse { optional int64 snapshot_id = 1; }

message MarkRunRunningRequest  { string run_id = 1; }
message MarkRunRunningResponse {}
message FinishRunFailedRequest {
  string run_id = 1;
  string error = 2;
  bool terminal = 3;  // true => Failed; false => back to Queued (retry)
}
message FinishRunFailedResponse {}

message BuildVectorIndexRequest  { string schema = 1; string name = 2; string index_name = 3; }
message BuildVectorIndexResponse { int64 covered_snapshot = 1; string puffin_path = 2; int64 row_count = 3; }

message WriteObjectRequest {
  string schema = 1;
  string name = 2;
  bytes  ipc = 3;            // one-row Arrow IPC stream (built + encoded client-side)
  string columns_json = 4;   // serde_json of Vec<ColumnSpec>
  string lineage_json = 5;   // serde_json of LineageWire
}
message WriteObjectResponse { int64 snapshot_id = 1; }

// Stage N per-target writes + one lineage event in one transaction (one snapshot).
message StepWrite {
  string schema = 1;
  string name = 2;
  bytes  ipc = 3;             // N-row Arrow IPC stream for this target (built client-side)
  string columns_json = 4;    // serde_json of Vec<ColumnSpec> describing ipc
  bool   overwrite = 5;       // true = replace the live set; false = append
}
message WriteStepsRequest {
  repeated StepWrite steps = 1;
  string lineage_json = 2;    // serde_json of LineageWire (all step targets in its outputs)
}
message WriteStepsResponse { int64 snapshot_id = 1; }

message OverwriteTableRequest {
  string schema = 1;
  string name = 2;
  bytes  ipc = 3;            // N-row Arrow IPC stream; empty = truncate (delete-all)
  string columns_json = 4;
  string lineage_json = 5;
}
message OverwriteTableResponse { int64 snapshot_id = 1; }

message CurrentInlineVersionRequest {
  string schema = 1;
  string name = 2;
  string id_column = 3;
  bytes  id_ipc = 4;          // one-row Arrow IPC holding just the id column
  string columns_json = 5;    // Vec<ColumnSpec> describing id_ipc
}
message CurrentInlineVersionResponse { int64 version = 1; }

message WriteDeltaRequest {
  string schema = 1;
  string name = 2;
  string id_column = 3;
  bool   tombstone = 4;
  bytes  ipc = 5;             // version: full one-row batch; tombstone: one-cell id batch
  string columns_json = 6;    // Vec<ColumnSpec> describing ipc
  string lineage_json = 7;    // LineageWire
  int64  expected_version = 8;
  bytes  before_ipc = 9;             // optional before-image: full one-row Arrow IPC of the prior row; empty => absent
  string before_columns_json = 10;  // Vec<ColumnSpec> describing before_ipc (positionally aligned)
}
message WriteDeltaResponse { int64 snapshot_id = 1; }

// ---- Governance-read messages. *_json fields are serde_json of the named core type. ----

message CheckRequest  { string subject_json = 1; string action_json = 2; string target_json = 3; }
message CheckResponse { string decision_json = 1; }   // Decision

message PoliciesForRequest {
  string subject_json = 1;
  string action_json = 2;
  string target_json = 3;
  string page_json = 4;     // PageReq
}
message PoliciesForResponse { string page_json = 1; }  // Page<Policy>

message GetTypeRequest  { string type_name = 1; }
message GetTypeResponse { string object_type_json = 1; }   // ObjectType

message ResolveRequest  { string type_name = 1; }
message ResolveResponse { string table_ref_json = 1; }     // TableRef

message LinksRequest  { string type_name = 1; string page_json = 2; }
message LinksResponse { string page_json = 1; }            // Page<LinkDef>

message LinksToRequest  { string type_name = 1; string page_json = 2; }
message LinksToResponse { string page_json = 1; }          // Page<LinkDef>

message ListTypesRequest  { string page_json = 1; }   // PageReq
message ListTypesResponse { string page_json = 1; }   // Page<ObjectType>

message ListActionsRequest  { string page_json = 1; }  // PageReq
message ListActionsResponse { string page_json = 1; }  // Page<ActionDef>

message GetActionRequest  { string action_name = 1; }
message GetActionResponse { string action_def_json = 1; }  // ActionDef

message VectorIndexesForRequest  { string type_name = 1; }
message VectorIndexesForResponse { string indexes_json = 1; }  // Vec<VectorIndexDef>

message GetVectorIndexRequest  { string type_name = 1; string name = 2; }
message GetVectorIndexResponse { string index_json = 1; }      // Option<VectorIndexDef>
