[package]
name = "managed-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time"] }

[dev-dependencies]
control-plane-postgres = { path = "../../control-plane/postgres" }
tempfile = "3"
