[package]
name = "service-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../../control-plane/core" }
control-plane-postgres = { path = "../../control-plane/postgres" }
argon2 = "0.5"
axum = "0.7"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "492234eb43b1aceee1b9379d5c676e4635b5d4d7" }
object_store = "0.13"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
utoipa-scalar = { version = "0.2", features = ["axum"] }
