[package]
name = "engine"
version = "0.1.0"
edition = "2024"

# NOTE: service-runtime (//src/services/runtime:runtime) is a buck-only crate with
# no Cargo manifest, so it is NOT listed here — the dependency lives in BUCK only,
# mirroring how ingest/query-api consume it. Cargo.toml exists only so reindeer's
# cargo-metadata resolves the third-party version graph; buck builds from BUCK deps.

[dependencies]
engine-wire = { path = "../engine-wire" }
control-plane-core = { path = "../../control-plane/core" }
control-plane-postgres = { path = "../../control-plane/postgres" }
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1", features = ["v4"] }
iceberg = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
async-trait = "0.1"
arrow-flight = "=57.3.1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
arrow-array = "57"
arrow-schema = "57"
# Pinned: time 0.3.48+ adds a trait impl that conflicts with sqlx-core 0.9's
# blanket From<T> for Json<T> under Rust 2024 orphan rules, breaking the build.
time = "=0.3.47"
