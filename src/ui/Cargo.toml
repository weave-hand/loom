[package]
name = "loom-ui"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "loom_ui_core"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
# wasm-bindgen pinned `=` to the //tools:wasm-bindgen CLI version
# (tools/wasm_bindgen.bzl) — the glue panics at load if crate != CLI.
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "=0.2.126"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlInputElement", "InputEvent", "SubmitEvent", "EventTarget"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
