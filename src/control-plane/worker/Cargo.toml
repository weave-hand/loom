[package]
name = "control-plane-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../core" }
# select! needs the macros feature; the loop itself does not spawn.
tokio = { version = "1", features = ["macros"] }
# CancellationToken for graceful shutdown (no extra tokio-util feature needed).
tokio-util = { version = "0.7", default-features = false }
# catch_unwind to contain a panicking handler (FutureExt::catch_unwind needs `std`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Tracing facade: libraries emit spans/events; the Step 3 service binaries install
# the subscriber. No subscriber/metrics here.
tracing = "0.1"
# Capturing subscriber for the instrumentation test (handles the global-default-once
# footgun + cross-thread capture). Test-only in buck (only worker_test's deps wire it);
# declared as a normal cargo dep so reindeer emits the //third-party:tracing-test target
# (reindeer skips dev-only deps in non-vendored mode).
# no-env-filter: integration tests (tests/) are a separate crate from the lib under
# test, so the default `{crate}=trace` filter drops the worker's events. This widens
# capture to all crates so logs_contain sees the worker's instrumentation.
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[dev-dependencies]
control-plane-memory = { path = "../memory" }
control-plane-postgres = { path = "../postgres" }
serde_json = "1"
# Tests spawn the worker and drive time; the normal-dep tokio-util is reused.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
