[package]
name = "control-plane-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../core" }
async-trait = "0.1"
# Normal (not dev) dependency so reindeer emits //third-party:tokio — reindeer
# only generates buck targets for normal/build deps, not dev-deps. Used both by
# the #[tokio::test] contract harness in tests/ and by the library itself
# (await_jobs uses tokio::sync::Notify + tokio::time::timeout), so memory/BUCK's
# rust_library now depends on it too.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# Pinned: time 0.3.48+ adds a trait impl that conflicts with sqlx-core 0.9's
# blanket From<T> for Json<T> under Rust 2024 orphan rules, breaking the build.
# Keep exact-pinned until sqlx-core ships a fix. See the ingest materializer PR.
time = "=0.3.47"
serde_json = "1"
# Tracing facade: libraries emit spans/events; the Step 3 service binaries install
# the subscriber. No subscriber/metrics here.
tracing = "0.1"
# Non-poisoning locks for the in-memory control-plane fake: parking_lot guards
# return the guard directly (no PoisonError), so the fake's hot paths need no
# .lock().unwrap() — keeping it clean under the enforced clippy::unwrap_used.
parking_lot = "0.12"

[dev-dependencies]
control-plane-testkit = { path = "../testkit" }
