[package]
name = "control-plane-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../core" }
# The shared parquet-footer stats merge (src/iceberg_stats.rs delegates to it).
# Declared here — not just in BUCK — because tools/sqlx-prepare.sh cargo-compiles
# this crate (`cargo sqlx prepare -- --lib`) to regenerate the .sqlx cache.
parquet-stats = { path = "../../parquet-stats" }
async-trait = "0.1"
# Local unix-socket connections only (no TLS). Compile-time query!/query_scalar!
# macros validate SQL against the committed .sqlx offline cache (see CLAUDE.md).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
# Pinned: time 0.3.48+ adds a trait impl that conflicts with sqlx-core 0.9's
# blanket From<T> for Json<T> under Rust 2024 orphan rules, breaking the build.
# Keep exact-pinned until sqlx-core ships a fix. See the ingest materializer PR.
time = { version = "=0.3.47", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the test fixture (src/fixture.rs) for ephemeral data/socket dirs.
tempfile = "3"
# Used by await_jobs for the polling-fallback timeout around PgListener::recv.
tokio = { version = "1", features = ["time"] }
# Tracing facade: libraries emit spans/events; the Step 3 service binaries install
# the subscriber. No subscriber/metrics here.
tracing = "0.1"
# Test-only (tests/lineage_roundtrip.rs), declared as a normal dep so reindeer emits
# //third-party:proptest in non-vendored mode (same pattern as the worker crate).
proptest = "1"
# Iceberg table-format adapter (read path): canonical metadata machinery. loom serves reads
# from its own iceberg_mirror.* projection; iceberg is used only in the test seeder + the
# vendored SQL catalog (src/iceberg_sql_catalog/, ported from iceberg-catalog-sql to sqlx 0.9).
# Pinned to iceberg-rust `main` (carrying the arrow/parquet 58 migration) ahead of the
# post-0.9.1 crates.io release — see CLAUDE.md (Third-party Rust deps) for the bump/exit path.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "148afc50ee950b2cd8d99c0243242ef45f3948c5" }
# Writer chain (slice 2 write path). iceberg `main` is on arrow/parquet 58, matching
# DataFusion 54 / DuckDB / ingest — one arrow major across the whole tree — so these are
# plain 58 deps with no rename trick (there is no second public major to disambiguate).
arrow-array = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow"] }
# arrow-ipc (IPC decode) + arrow-select (multi-batch concat) for iceberg_landing.
arrow-ipc = { version = "58", default-features = false }
arrow-select = { version = "58", default-features = false }
# iceberg's InputFile::read() yields `bytes::Bytes`, which is also a parquet
# `ChunkReader` — the write path reads file bytes and feeds them straight to the
# footer-stats reader (src/iceberg_stats.rs). Same `bytes` 1.x the rest of the
# graph resolves to (iceberg/parquet/reqwest all depend on it), so no new version.
bytes = "1"
# Used by iceberg_schema_evolution: SchemaEvolutionError derive.
thiserror = "1"
# S3/MinIO Iceberg storage (src/iceberg_sql_catalog/s3_storage.rs). The `aws`
# feature pulls object_store's AmazonS3 client. reindeer unions features across the
# workspace, so this also enables `aws` on the shared //third-party:object_store the
# services already depend on (the serving S3 read path needs it too).
object_store = { version = "0.13", features = ["aws"] }
# iceberg's Storage/StorageFactory traits are #[typetag::serde]; impls need the attr.
# `serde` (declared above) also satisfies the #[typetag::serde] impls in s3_storage.rs
# (S3Storage / S3StorageFactory) so cargo check resolves their trait bounds.
typetag = "0.2"
# Async S3 ObjectStore methods return futures::stream for list(); pull StreamExt.
futures = "0.3"
# AWS SigV4 PUT-bucket in the MinIO fixture (fixture.rs is compiled into the lib,
# not test code). reqwest async client for create_bucket; hmac/sha2/hex for SigV4.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# fixture.rs: shared-cluster lifecycle (PDEATHSIG + atexit reaper)
libc = "0.2"

[dev-dependencies]
control-plane-testkit = { path = "../testkit" }
tokio = { version = "1", features = ["macros", "rt"] }
