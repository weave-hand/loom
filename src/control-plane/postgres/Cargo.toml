[package]
name = "control-plane-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
control-plane-core = { path = "../core" }
async-trait = "0.1"
# Local unix-socket connections only (no TLS). Compile-time query!/query_scalar!
# macros validate SQL against the committed .sqlx offline cache (see CLAUDE.md).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
# Pinned: time 0.3.48+ adds a trait impl that conflicts with sqlx-core 0.9's
# blanket From<T> for Json<T> under Rust 2024 orphan rules, breaking the build.
# Keep exact-pinned until sqlx-core ships a fix. See the ingest materializer PR.
time = "=0.3.47"
serde_json = "1"
# Used by the test fixture (src/fixture.rs) for ephemeral data/socket dirs.
tempfile = "3"
# Used by await_jobs for the polling-fallback timeout around PgListener::recv.
tokio = { version = "1", features = ["time"] }
# Tracing facade: libraries emit spans/events; the Step 3 service binaries install
# the subscriber. No subscriber/metrics here.
tracing = "0.1"
# Test-only (tests/lineage_roundtrip.rs), declared as a normal dep so reindeer emits
# //third-party:proptest in non-vendored mode (same pattern as the worker crate).
proptest = "1"
# Iceberg table-format adapter (read path): canonical metadata machinery. loom serves reads
# from its own iceberg_mirror.* projection; iceberg is used only in the test seeder + the
# vendored SQL catalog (src/iceberg_sql_catalog/, ported from iceberg-catalog-sql to sqlx 0.9).
iceberg = "0.9"
# Writer chain (slice 2 write path). iceberg 0.9 pins arrow/parquet 57 and does NOT re-export the
# construction types the writer names (RecordBatch, WriterProperties), so postgres depends on 57
# directly. ingest/datafusion-io depend on parquet 58 (datafusion 54), so `parquet` has two public
# majors — `parquet` is RENAMED to `parquet57` so reindeer emits a distinct `//third-party:parquet57`
# alias (→ parquet 57) alongside the bare `parquet` (→ 58), no collision. This works because loom's
# reindeer fork honours workspace-member dep renames (reindeer#1). arrow-array/arrow-schema have no
# other direct dep, so their bare aliases already resolve to 57 — no rename needed.
arrow-array = "57"
arrow-schema = "57"
parquet57 = { package = "parquet", version = "57", default-features = false, features = ["arrow"] }

[dev-dependencies]
control-plane-testkit = { path = "../testkit" }
tokio = { version = "1", features = ["macros", "rt"] }
