# apko/Wolfi base for the loom query-api image. Like ingest it's a glibc
# (x86_64-unknown-linux-gnu, dynamically linked) Rust binary. query-api is now a
# pure wire client — it reads over the engine's Arrow Flight service — so it no
# longer bundles an embedded C++ analytics engine and needs no libstdc++. Its
# only native runtime deps are glibc + libgcc, so the base matches the ingest
# base exactly: glibc + libgcc + CA certs (outbound TLS to the object store). The
# query-api binary is layered on at /usr/local/bin/query-api by oci_image. Runs
# as a non-root user. Refresh the lockfile with `apko lock apko.yaml` when this
# changes.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - glibc
    - libgcc
accounts:
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  groups:
    - groupname: nonroot
      gid: 65532
  run-as: 65532
entrypoint:
  command: /usr/local/bin/query-api
archs:
  - x86_64
  - aarch64
