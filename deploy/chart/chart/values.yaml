# loom umbrella chart values. The chart deploys the two loom services (ingest +
# query-api) against a Postgres control plane (CloudNativePG by default) and a
# shared object-store volume. Security posture is locked down by default:
# default-deny NetworkPolicy, no ingress, non-root + read-only rootfs containers.

nameOverride: ""
fullnameOverride: ""

# --- Services -----------------------------------------------------------------
# image.repository/digest are digest-pinned by the buck2 release build
# (helm_images_values overlays them). image.tag is the fallback used by
# `helm template` and manual installs when no digest is injected.
ingest:
  image:
    repository: ghcr.io/weave-hand/loom-ingest
    tag: latest
    digest: ""
    # IfNotPresent is safe on the release path (digest-pinned, immutable). Set to
    # Always if you deploy by a mutable tag (e.g. latest) and want re-pulls.
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

queryApi:
  image:
    repository: ghcr.io/weave-hand/loom-query-api
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  # By default query-api is co-scheduled onto the same node as ingest (see
  # templates/query-api.yaml) so both can mount the shared ReadWriteOnce
  # object-store PVC. Setting this overrides that default (use with RWX).
  affinity: {}

# Engine: runs as a SIDECAR in the query-api pod (not a standalone Deployment).
# query-api is a pure wire client and reads over the engine's Arrow Flight
# service via a shared unix-domain socket (socketPath, on the socketDir emptyDir
# mounted into both containers). The engine reads the same warehouse as query-api
# and talks to Postgres + the object store over the pod's existing egress.
engine:
  image:
    repository: ghcr.io/weave-hand/loom-engine
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  # Placeholder TCP port for service_runtime's LOOM_BIND_ADDR parse; the engine
  # actually serves on socketPath, so nothing connects to this port.
  port: 8081
  # Shared socket directory (emptyDir mount) and the socket file within it.
  socketDir: /run/loom
  socketPath: /run/loom/engine.sock
  resources: {}

# Service lock-timeout (ms) -> LOOM_LOCK_TIMEOUT_MS.
lockTimeoutMs: 5000

# --- Schema migrations ---------------------------------------------------------
# How loom's control-plane schema (src/control-plane/postgres/migrations) is
# applied to the managed Postgres. A fresh install must migrate before the
# services can serve.
#   job      – (default) a pre-install/pre-upgrade Helm hook Job runs the
#              migrate-and-exit entrypoint (LOOM_MIGRATE=apply, ingest image)
#              before the Deployments roll. DDL rights live on the one-shot Job.
#   onBoot   – LOOM_DB_MIGRATE_ON_BOOT=true on the service containers; each pod
#              migrates at startup. Concurrent replicas race on sqlx's advisory
#              lock (first wins, rest no-op) — every pod needs DDL rights.
#   external – neither; apply migrations yourself (pre-chart behaviour).
migrations:
  mode: job
  # Retry cap for the mode=job hook Job.
  backoffLimit: 3

# --- Object store -------------------------------------------------------------
# Shared volume backing LOOM_DATA_PATH (the Parquet files the catalog
# references). The storage *class* is deliberately the deployer's choice — loom
# does not pick one ("" = the cluster's default StorageClass).
#
# ingest writes and query-api reads the SAME data. With the default
# ReadWriteOnce, query-api is co-scheduled onto ingest's node (see
# templates/query-api.yaml) so both can mount the volume; for multi-node spread
# supply an RWX storageClassName and override queryApi.affinity.
objectStore:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/loom/data
  # Keep the PVC (and its landed Parquet data) on `helm uninstall` instead of
  # letting Helm delete it. Set false to allow deletion.
  retain: true
  # Optional S3/MinIO warehouse. When enabled, the shared PVC is NOT created and
  # all three containers read/write the Iceberg warehouse over S3 — removing the
  # single-node ReadWriteOnce co-scheduling constraint. The binary already builds
  # an S3 store from this config; this is pure chart wiring. Default (disabled)
  # keeps the file:// PVC path unchanged.
  s3:
    enabled: false
    bucket: ""
    # Prefix within the bucket: warehouse_uri = s3://<bucket>[/<prefix>].
    prefix: ""
    # MinIO / non-AWS endpoint URL. Empty ⇒ real AWS S3. Path-style is implied
    # by the binary whenever an endpoint is set (required by MinIO).
    endpoint: ""
    region: us-east-1
    # TCP port of the S3 endpoint, opened as egress by the NetworkPolicy. 443 for
    # AWS S3; set to your MinIO port (commonly 9000) for an in-cluster endpoint.
    port: 443
    # Existing secret carrying the S3 credentials (referenced, not created).
    credentialsSecret: ""
    credentialsKeys:
      accessKeyId: AWS_ACCESS_KEY_ID
      secretAccessKey: AWS_SECRET_ACCESS_KEY

# --- Postgres control plane (CloudNativePG) -----------------------------------
# Requires the CloudNativePG operator + CRDs installed in the cluster. The
# operator generates a `<cluster>-app` secret with the connection fields the
# services consume. Set enabled=false to use an external Postgres via
# external.existingSecret.
postgres:
  enabled: true
  instances: 1
  imageName: ""              # "" -> CNPG operator default
  database: loom
  owner: loom
  storage:
    size: 8Gi
    storageClassName: ""
  resources: {}
  # Used only when enabled=false. Point at an existing secret and map its keys.
  external:
    existingSecret: ""
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname

# --- Networking (locked down by default) --------------------------------------
# Default-deny NetworkPolicy for loom's pods: all ingress denied, egress denied
# except DNS and the in-cluster Postgres. Append your own rules via extra*.
networkPolicy:
  enabled: true
  # Allow egress to DNS (kube-dns) on 53. Disable only if your CNI handles it.
  allowDNS: true
  extraIngress: []
  extraEgress: []

# Optional Gateway API HTTPRoute. Off by default — "no ingress to begin with".
# The gatewayClassName lives on the Gateway object (cluster-managed), so this
# references an existing parent Gateway by name/namespace; when enabled, a
# matching NetworkPolicy ingress rule is opened to the target service.
gateway:
  enabled: false
  service: queryApi          # queryApi | ingest
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  hostnames: []
  matchPath: /

# --- Security contexts --------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
