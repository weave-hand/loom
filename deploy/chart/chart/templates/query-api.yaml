apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.fullname" . }}-query-api
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: query-api
spec:
  replicas: {{ .Values.queryApi.replicas }}
  selector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: query-api
  template:
    metadata:
      labels:
        {{- include "loom.labels" . | nindent 8 }}
        app.kubernetes.io/component: query-api
    spec:
      serviceAccountName: {{ include "loom.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: query-api
          image: {{ include "loom.image" .Values.queryApi.image | quote }}
          imagePullPolicy: {{ .Values.queryApi.image.pullPolicy | default "IfNotPresent" }}
          # CWD on the writable /tmp emptyDir (read-only rootfs otherwise).
          workingDir: /tmp
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.queryApi.port }}
          env:
            - name: LOOM_BIND_ADDR
              value: "0.0.0.0:{{ .Values.queryApi.port }}"
            - name: LOOM_DATA_PATH
              value: {{ .Values.objectStore.mountPath | quote }}
            - name: LOOM_LOCK_TIMEOUT_MS
              value: {{ .Values.lockTimeoutMs | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            # query-api is a pure wire client: it reads over the engine sidecar's
            # Arrow Flight service via this shared unix-domain socket. The engine
            # container (below) binds the same path on the shared `engine-sock`
            # emptyDir volume.
            - name: LOOM_ENGINE_SOCKET
              value: {{ .Values.engine.socketPath | quote }}
            {{- include "loom.dbEnv" . | nindent 12 }}
            {{- include "loom.migrateOnBootEnv" . | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: {{ .Values.objectStore.mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: engine-sock
              mountPath: {{ .Values.engine.socketDir | quote }}
          {{- with .Values.queryApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # Engine sidecar: serves the Arrow Flight read path + control plane over
        # the shared unix-domain socket query-api connects to. Same pod ⇒ shared
        # lifecycle and network identity; it reaches Postgres + the object store
        # over the query-api pod's existing egress. It reads the SAME warehouse as
        # query-api (file://LOOM_DATA_PATH by default), so it mounts the same data
        # volume.
        - name: engine
          image: {{ include "loom.image" .Values.engine.image | quote }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy | default "IfNotPresent" }}
          workingDir: /tmp
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # The engine serves on the unix socket, not TCP, but service_runtime's
            # Config::from_env still parses LOOM_BIND_ADDR — give it a placeholder.
            - name: LOOM_BIND_ADDR
              value: "127.0.0.1:{{ .Values.engine.port }}"
            - name: LOOM_DATA_PATH
              value: {{ .Values.objectStore.mountPath | quote }}
            - name: LOOM_LOCK_TIMEOUT_MS
              value: {{ .Values.lockTimeoutMs | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: LOOM_ENGINE_SOCKET
              value: {{ .Values.engine.socketPath | quote }}
            {{- include "loom.dbEnv" . | nindent 12 }}
            {{- include "loom.migrateOnBootEnv" . | nindent 12 }}
          # Readiness gates the pod on the engine having bound the socket so
          # query-api never connects before it exists.
          readinessProbe:
            exec:
              command:
                - test
                - -S
                - {{ .Values.engine.socketPath | quote }}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: {{ .Values.objectStore.mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: engine-sock
              mountPath: {{ .Values.engine.socketDir | quote }}
          {{- with .Values.engine.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "loom.fullname" . }}-data
        - name: tmp
          emptyDir: {}
        # Shared socket dir for the query-api ⇄ engine-sidecar Flight UDS.
        - name: engine-sock
          emptyDir: {}
      {{- with .Values.queryApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.queryApi.affinity }}
      affinity:
        {{- toYaml .Values.queryApi.affinity | nindent 8 }}
      {{- else }}
      # Default: co-schedule onto the same node as ingest so both pods can mount
      # the shared ReadWriteOnce object-store PVC. Override queryApi.affinity (and
      # use an RWX storageClassName) to spread across nodes.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "loom.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: ingest
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.queryApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.fullname" . }}-query-api
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: query-api
spec:
  type: ClusterIP
  selector:
    {{- include "loom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: query-api
  ports:
    - name: http
      port: {{ .Values.queryApi.port }}
      targetPort: http
