# Shared object-store volume backing LOOM_DATA_PATH for both services. The
# StorageClass is the deployer's choice ("" = cluster default). For >1 replica
# across pods this must be ReadWriteMany (see values.yaml objectStore notes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "loom.fullname" . }}-data
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
  {{- if .Values.objectStore.retain }}
  annotations:
    # Keep the PVC (and its landed Parquet data) on `helm uninstall`.
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.objectStore.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.objectStore.size }}
  {{- if .Values.objectStore.storageClassName }}
  storageClassName: {{ .Values.objectStore.storageClassName | quote }}
  {{- end }}
