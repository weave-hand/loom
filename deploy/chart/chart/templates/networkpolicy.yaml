{{- if .Values.networkPolicy.enabled -}}
# Default-deny for all loom workload pods: nothing in, nothing out. Additional
# NetworkPolicies below open exactly the egress loom needs (DNS, Postgres) and,
# when a Gateway is wired, the one ingress path. NetworkPolicies are additive,
# so the union of these is the allowed surface.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}-default-deny
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
{{- if .Values.networkPolicy.allowDNS }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}-allow-dns
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}-allow-postgres
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "loom.pgClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
---
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $gwNs := .Values.gateway.parentRef.namespace | default .Release.Namespace }}
{{- $port := ternary .Values.ingest.port .Values.queryApi.port (eq .Values.gateway.service "ingest") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}-allow-gateway
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ eq .Values.gateway.service "ingest" | ternary "ingest" "query-api" }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gwNs | quote }}
      ports:
        - protocol: TCP
          port: {{ $port }}
---
{{- end }}
{{- with .Values.networkPolicy.extraIngress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" $ }}-extra-ingress
  labels:
    {{- include "loom.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- toYaml . | nindent 4 }}
---
{{- end }}
{{- with .Values.networkPolicy.extraEgress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" $ }}-extra-egress
  labels:
    {{- include "loom.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
