# prek (https://github.com/j178/prek) hook config. Run hooks with
# `buck2 run //tools:prek -- run --all-files`; install the git hook with
# `buck2 run //tools:prek -- install`. All Rust tooling is hermetic — it goes
# through the pinned buck2 toolchain, so no system rustup is required.

# Install all three shim types on a plain `prek install` (default is just
# pre-commit) — otherwise the commit-msg and pre-push hooks below never fire.
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt (hermetic)"
entry = "buck2 run root//tools:rustfmt -- --check"
language = "system"
types = ["rust"]
pass_filenames = true

# Runs the buck2-native clippy sub-target over every first-party Rust target
# (queried from the graph, so new crates are covered automatically) and fails
# if any emitted diagnostics. See tools/clippy-all.sh.
[[repos.hooks]]
id = "clippy"
name = "clippy (hermetic)"
entry = "./tools/clippy-all.sh"
language = "system"
types = ["rust"]
pass_filenames = false

# buck2 only runs `rust_test` integration targets — an inline `#[cfg(test)]` unit
# test in a `rust_library`/`rust_binary` src compiles but is silently never run.
# Fail if a first-party src file (outside a `tests/` dir) has an inline #[test], so
# unit tests live in `tests/<name>.rs` + a rust_test target. See tools/check-inline-tests.sh.
[[repos.hooks]]
id = "no-inline-tests"
name = "no inline #[test] in src"
entry = "tools/check-inline-tests.sh"
language = "system"
types = ["rust"]
pass_filenames = true

# When a Cargo manifest/lock changes, regenerate third-party/BUCK and fail if it
# drifted — keeps reindeer's output in sync with the dependency graph.
[[repos.hooks]]
id = "reindeer-check"
name = "reindeer in sync"
entry = "bash -c './tools/buckify.sh && git diff --exit-code third-party/BUCK'"
language = "system"
files = "Cargo\\.(toml|lock)$"
pass_filenames = false

# When the Python manifest/lock or muntjac config changes, regenerate
# third-party/python/ (frozen: no re-lock, no network — muntjac's staleness
# gate is mtime-based and CI checkout mtimes are arbitrary) and fail if the
# generated tree or the lockfile drifted — the Python reindeer-check.
[[repos.hooks]]
id = "muntjac-check"
name = "muntjac in sync"
entry = "bash -c './tools/pybuckify.sh --frozen && git diff --exit-code third-party/python src/sdk/python/uv.lock'"
language = "system"
files = "(^|/)(pyproject\\.toml|uv\\.lock)$|^muntjac\\.toml$"
pass_filenames = false

# Enforce Conventional Commits on the message itself (commit-msg stage). Local
# regex check — no Python/Node, so it stays hermetic. See tools/check-commit-msg.sh.
[[repos.hooks]]
id = "conventional-commit"
name = "conventional commit message"
entry = "tools/check-commit-msg.sh"
language = "system"
stages = ["commit-msg"]

# Heavier checks run only on push, not every commit.
# -M none: the hook only needs to know the tree BUILDS — without it every push
# materializes every final artifact from the RE CAS onto the dev machine
# (~29 GiB fully materialized; see docs/build-execution.md). Validation is
# identical; the outputs just stay in the CAS. (buck2-test below can't take it:
# locally-run test binaries must materialize to execute.)
[[repos.hooks]]
id = "buck2-build"
name = "buck2 build"
entry = "buck2 build -M none root//src/..."
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "buck2-test"
name = "buck2 test"
entry = "buck2 test //src/..."
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "query-api-postgres-free"
name = "query-api lib has no direct postgres dep"
entry = "bash tools/check-query-api-postgres-free.sh"
language = "system"
pass_filenames = false
stages = ["pre-push"]
