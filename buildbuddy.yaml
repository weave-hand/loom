# loom CI — BuildBuddy Workflows. Source of truth for build/test/lint (it replaced
# the retired .github/workflows/ci.yml). Runs on BuildBuddy runners co-located with the RE/cache;
# workflow VMs are snapshotted/reused, so the per-action setup
# (tools/ci/buildbuddy-setup.sh) is near-instant on warm runs.
#
# PREREQUISITE: an org secret named BUILDBUDDY_API_KEY must exist (BuildBuddy UI →
# org settings → Secrets). .buckconfig's [buck2_re_client] reads $BUILDBUDDY_API_KEY
# to authenticate RE/cache, and the runner does not expose its internal key to
# non-bazel tools. Secrets are auto-injected as env vars for trusted runs.
#
# container_image is ubuntu-24.04 (matches GitHub's ubuntu-latest): the prebuilt
# //tools:supertd and //tools:btd binaries (rsJames-ttrpg/buck2-change-detector
# fork releases) are linked against GLIBC_2.39, which ubuntu-22.04 (glibc 2.35)
# lacks. `buck2 run` executes those binaries locally on the runner, so the runner
# image must carry the newer glibc.
actions:
  # Full build + test on pushes to main (main must always be fully green). PRs use
  # the cheaper `affected` action below.
  - name: build-test
    triggers:
      push:
        branches: [main]
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    # Keep buck-out across runs on a reused VM. The runner's repo-sync runs
    # `git clean -x` (which would delete the gitignored buck-out) while the snapshot
    # restores the buck2 daemon; excluding buck-out keeps the warm daemon + cache
    # consistent (otherwise the daemon points at a missing buck-out and the first
    # `buck2 build` fails "Failed to stat .../buck-out/v2").
    git_clean_exclude: ["buck-out"]
    env:
      BUCK_PREFER_REMOTE: "true"
    steps:
      - run: ./tools/ci/buildbuddy-setup.sh
      # -M none: validate the build on RE without downloading final artifacts.
      - run: buck2 build -M none //src/... //third-party/python/...
      # Builds run on RE. Test-RUN actions default to the LOCAL executor (buck2/tpx),
      # so the postgres/duckdb fixtures only run as the runner user unless routed to RE
      # — green today only because the runner is non-root. --unstable-allow-all-tests-on-re
      # dispatches the test runs to RE (non-root `buildbuddy` worker) explicitly, so this
      # no longer depends on the runner's user. (No buckconfig key for it; no result cache.)
      - run: buck2 test //src/... --unstable-allow-all-tests-on-re

  # On PRs (base = main), build & test only the first-party targets the diff impacts,
  # computed by btd. merge_with_base: false keeps HEAD at the clean PR head (btd diffs
  # base->head, not a base+head merge commit); git_fetch_depth: 0 supplies the history
  # `git merge-base` needs.
  - name: affected
    triggers:
      pull_request:
        branches: [main]
        merge_with_base: false
    git_fetch_depth: 0
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    # Keep buck-out across runs on a reused VM. The runner's repo-sync runs
    # `git clean -x` (which would delete the gitignored buck-out) while the snapshot
    # restores the buck2 daemon; excluding buck-out keeps the warm daemon + cache
    # consistent (otherwise the daemon points at a missing buck-out and the first
    # `buck2 build` fails "Failed to stat .../buck-out/v2").
    git_clean_exclude: ["buck-out"]
    env:
      BUCK_PREFER_REMOTE: "true"
    steps:
      - run: ./tools/ci/buildbuddy-setup.sh
      - run: |
          set -euo pipefail
          head_root="$PWD"

          # Base is `main` by construction (this action only fires on PRs based on
          # main). The runner exposes no base-branch env var, so fetch it explicitly.
          git fetch --no-tags origin main
          base_sha="$(git merge-base FETCH_HEAD HEAD)"

          # Changed files in the sapling/`hg status` format btd expects:
          # one line per file, "<M|A|D> <project-relative-path>".
          git diff --name-status --no-renames "$base_sha" HEAD \
            | awk 'NF >= 2 { print substr($1, 1, 1) " " $2 }' > changes.txt
          echo "=== changed files ==="; cat changes.txt

          # supertd is a standalone target-graph tool: it reads BUCK files directly to
          # emit the target graph. It still spins up (or reconnects to) a buck2 daemon,
          # which validates the working directory and requires its buck-out/v2 to exist.
          # Build the binary ONCE here in the healthy head checkout (the command_alias
          # //tools:supertd can't be exec'd against another cwd, so build the concrete
          # arch binary), then run it against both trees below. arch is pinned amd64.
          supertd="$(buck2 build //tools:supertd-bin-x86_64 --show-full-simple-output)"

          # Head (after) graph: run supertd in this checkout.
          "$supertd" targets root//... --output "$head_root/diff.jsonl"

          # Base (before) graph: a PERSISTENT worktree at the base commit, run through
          # the SAME supertd binary. supertd reads BUCK files but still (re)starts a
          # buck2 daemon, which validates the working dir and requires its buck-out/v2.
          # We must KEEP _base/buck-out warm across runs so that daemon stays consistent
          # — exactly the warm-daemon design the other actions rely on, and which the
          # `buck-out` exclude in git_clean_exclude already grants _base (the pattern
          # matches at any depth, so the runner's `git clean -x` preserves _base/buck-out
          # too). The old `rm -rf "$base_dir"` defeated that: it deleted the very buck-out
          # the exclude preserved, leaving the snapshot-restored daemon pointed at a
          # missing buck-out ("Failed to stat _base/buck-out/v2"). So REUSE the worktree
          # instead — just move it to the new base commit, keeping buck-out — and only
          # recreate it when it is genuinely absent.
          base_dir="${BUILDBUDDY_CI_RUNNER_ROOT_DIR:-$head_root}/_base"
          git worktree prune
          # `git clean -x` wipes the worktree's tracked files while the exclude keeps
          # _base/buck-out, which severs the _base/.git link; repair restores it so the
          # worktree (and its warm buck-out) is reusable rather than recreated.
          git worktree repair "$base_dir" 2>/dev/null || true
          if git -C "$base_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$base_dir" checkout --force --detach "$base_sha"
          else
            rm -rf "$base_dir"
            git worktree add --force --detach "$base_dir" "$base_sha"
          fi
          # The runner checks out no submodules and worktrees don't inherit them, so
          # re-init prelude (supertd parses it) every run.
          git -C "$base_dir" submodule update --init --recursive
          # Guard the recreate path: a stale daemon surviving the VM snapshot would die
          # statting the empty buck-out of a freshly re-added worktree. Ensuring the dir
          # exists makes supertd's validation pass; in the warm path it already exists.
          mkdir -p "$base_dir/buck-out/v2"
          ( cd "$base_dir" && "$supertd" targets root//... --output "$head_root/base.jsonl" )

          # Impacted first-party targets. With BOTH graphs supplied (--base + --diff),
          # btd is pure computation — it never invokes buck2/supertd itself. Scope to
          # //src — that's what we build/test; third-party deps come along transitively.
          buck2 run //tools:btd -- \
            --changes changes.txt --base base.jsonl --diff diff.jsonl --json-lines \
            | jq -r 'select(.target | startswith("root//src/")) | .target' \
            | sort -u > impacted.txt
          echo "=== impacted targets ==="; cat impacted.txt

          if [ -s impacted.txt ]; then
            mapfile -t targets < impacted.txt
            echo "Building/testing: ${targets[*]}"
            buck2 build -M none "${targets[@]}"
            # --unstable-allow-all-tests-on-re: route test runs to RE so fixtures run
            # as the non-root `buildbuddy` worker, not the runner user. See build-test.
            buck2 test "${targets[@]}" --unstable-allow-all-tests-on-re
          else
            echo "No first-party targets impacted by this diff — nothing to build/test."
          fi

  # prek hooks (rustfmt, clippy, file checks, reindeer-in-sync) on all events, so CI
  # enforces exactly what local pre-commit does. Fully hermetic via buck2.
  - name: lint
    triggers:
      push:
        branches: [main]
      pull_request:
        branches: [main]
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    # Keep buck-out across runs on a reused VM. The runner's repo-sync runs
    # `git clean -x` (which would delete the gitignored buck-out) while the snapshot
    # restores the buck2 daemon; excluding buck-out keeps the warm daemon + cache
    # consistent (otherwise the daemon points at a missing buck-out and the first
    # `buck2 build` fails "Failed to stat .../buck-out/v2").
    git_clean_exclude: ["buck-out"]
    env:
      BUCK_PREFER_REMOTE: "true"
    steps:
      - run: ./tools/ci/buildbuddy-setup.sh
      - run: buck2 run //tools:prek -- run --all-files --show-diff-on-failure

  # Publish the loom-sdk wheel to ghcr on pushes to main: immutable per-commit
  # tag (sha-<short>) + a moving `edge` channel, mirroring the image/chart scheme.
  # The wheel builds hermetically in the //src sweep; this action does the
  # credentialed push (kept off build-test for the same reason images are off it).
  #
  # Credentials: unlike GitHub Actions, BuildBuddy does NOT auto-inject a GitHub
  # token — the GitHub App/OAuth link authorizes BuildBuddy to clone + report
  # status, but that credential is never surfaced into the action env, and its
  # App-install scopes don't include packages:write anyway. So ghcr push needs an
  # explicit BuildBuddy org secret: GITHUB_TOKEN, a *classic* PAT with the
  # `write:packages` scope (ghcr accepts classic PATs only — fine-grained tokens
  # have no packages scope), created at
  # https://app.buildbuddy.io/settings/org/secrets. GHCR_USER (the PAT owner's
  # GitHub username) is optional; it defaults to the org. Secrets are only exposed
  # to trusted runs (pushes to main from collaborators qualify).
  - name: publish-wheel
    triggers:
      push:
        branches: [main]
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    git_clean_exclude: ["buck-out"]
    env:
      BUCK_PREFER_REMOTE: "true"
    steps:
      - run: ./tools/ci/buildbuddy-setup.sh
      # Fail-fast: build the hermetic wheel (natural config) before touching the
      # registry, so a broken wheel fails the action before any push/login attempt.
      - run: buck2 build //src/sdk/python:wheel
      - run: |
          set -euo pipefail
          # Fail loudly if the secret is missing/empty rather than piping an empty
          # password into crane (which writes a broken credential and only fails
          # later at push time). ${VAR:?msg} aborts with a clear diagnostic.
          : "${GITHUB_TOKEN:?GITHUB_TOKEN org secret not set — add a classic PAT with write:packages in BuildBuddy org secrets}"
          short="$(git rev-parse --short=7 HEAD)"
          printf '%s' "$GITHUB_TOKEN" | buck2 run deploy//buck2/bin:crane -- auth login ghcr.io -u "${GHCR_USER:-weave-hand}" --password-stdin
          buck2 run deploy//sdk:wheel.push -- "sha-$short" edge

  # Publish the four service images + Helm chart to ghcr on pushes to main:
  # immutable sha-<short> images for ingest/query-api/engine/worker, then the chart
  # as the moving `bleeding-edge` channel (digest-pinned to those images), plus a
  # versioned chart when deploy/chart/chart/Chart.yaml's `version` is new (bump it
  # to cut one). Ported from the release.yml `edge` job so ALL main-push publishing
  # lives on BuildBuddy; the intentional versioned `release` (a workflow_dispatch
  # with a typed version input that cuts a GitHub Release) stays on GitHub Actions —
  # BuildBuddy's push/PR/cron trigger model can't express it.
  #
  # Credentials: the same GITHUB_TOKEN org secret as publish-wheel (a classic PAT
  # with write:packages; see that action's note). GHCR_USER is optional and defaults
  # to the org. The deploy// image/chart targets build locally (apko fetches over the
  # network) with the Rust binaries on RE, so they're off the //src sweep.
  - name: publish-images
    triggers:
      push:
        branches: [main]
    os: linux
    arch: amd64
    container_image: ubuntu-24.04
    git_clean_exclude: ["buck-out"]
    env:
      BUCK_PREFER_REMOTE: "true"
      CHART_OCI: ghcr.io/weave-hand/charts/loom
    steps:
      - run: ./tools/ci/buildbuddy-setup.sh
      # Single block so the crane/helm credentials (written to ~/.docker/config.json
      # and helm's registry config by the logins) persist through the pushes below.
      - run: |
          set -euo pipefail
          : "${GITHUB_TOKEN:?GITHUB_TOKEN org secret not set — add a classic PAT with write:packages in BuildBuddy org secrets}"
          user="${GHCR_USER:-weave-hand}"
          short="$(git rev-parse --short=7 HEAD)"

          # crane (image push) reads ~/.docker/config.json; helm (chart push) keeps
          # its own registry config. Log both in via the pinned CLIs.
          printf '%s' "$GITHUB_TOKEN" | buck2 run deploy//buck2/bin:crane -- auth login ghcr.io -u "$user" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | buck2 run deploy//buck2/bin:helm  -- registry login ghcr.io -u "$user" --password-stdin

          # Immutable per-commit image tags only — the moving channel is the chart
          # (bleeding-edge), which digest-pins these exact images.
          buck2 run deploy//images/ingest:image.push    -- "sha-$short"
          buck2 run deploy//images/query-api:image.push -- "sha-$short"
          buck2 run deploy//images/engine:image.push    -- "sha-$short"
          buck2 run deploy//images/worker:image.push    -- "sha-$short"

          cv="$(awk '/^version:/{print $2; exit}' deploy/chart/chart/Chart.yaml)"

          # Bleeding-edge chart: a moving SemVer `0.0.0-edge` (helm-pullable via
          # --version 0.0.0-edge), then crane-tagged `bleeding-edge` to mirror the
          # image tag (helm push can't emit a non-SemVer tag itself). appVersion is
          # the main snapshot; the images it deploys are digest-pinned at build time.
          sed -i -E "s/^version:.*/version: 0.0.0-edge/; s/^appVersion:.*/appVersion: \"sha-$short\"/" \
            deploy/chart/chart/Chart.yaml
          buck2 run deploy//chart:chart.push
          buck2 run deploy//buck2/bin:crane -- tag "$CHART_OCI:0.0.0-edge" bleeding-edge
          echo "published bleeding-edge chart (0.0.0-edge, appVersion sha-$short)"

          # Released chart: publish at the committed Chart.yaml version, but only
          # when that version isn't already in ghcr (bump it to cut a chart release).
          git checkout -- deploy/chart/chart/Chart.yaml
          if buck2 run deploy//buck2/bin:crane -- manifest "$CHART_OCI:$cv" >/dev/null 2>&1; then
            echo "chart $cv already published — bump deploy/chart/chart/Chart.yaml 'version' to release a new chart."
          else
            sed -i -E "s/^appVersion:.*/appVersion: \"sha-$short\"/" deploy/chart/chart/Chart.yaml
            buck2 run deploy//chart:chart.push
            echo "published chart $cv (appVersion sha-$short) to $CHART_OCI"
          fi
