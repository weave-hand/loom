name: release

# Image + Helm chart publishing for loom. The deploy// buck2 targets build local
# (apko fetches packages over the network) with the Rust binaries on BuildBuddy
# RE; they're off the normal CI sweep, so they only run here.
#
# Two flows by event. The former push-to-main `edge` flow moved to BuildBuddy's
# `publish-images` action (buildbuddy.yaml) — all main-push publishing lives there
# now. Only the GitHub-native flows below stay here, because BuildBuddy's
# push/PR/cron trigger model can't express them (no manual dispatch with a typed
# input; no GitHub Release creation):
#
# - workflow_dispatch -> `release`: tag the images `X.Y.Z` + `latest` and cut a
#                        `vX.Y.Z` git tag + GitHub Release. Versioned releases are
#                        intentional — there is no auto-increment.
# - pull_request       -> `dev-image`: push dev preview images + chart for same-repo
#                        PRs (0.0.0-pr<N>.sha<short> + pr-<N>).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (tags images + cuts a GitHub Release)."
        required: true

# Per-ref concurrency so each PR and each dispatch are independent groups.
# PR builds cancel superseded runs; release dispatches never cancel mid-run.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUCK2_RELEASE: "2026-05-18"
  BUCK_PREFER_REMOTE: "true"
  REGISTRY: ghcr.io
  INGEST_IMAGE: ghcr.io/weave-hand/loom-ingest
  QUERY_API_IMAGE: ghcr.io/weave-hand/loom-query-api
  ENGINE_IMAGE: ghcr.io/weave-hand/loom-engine
  WORKER_IMAGE: ghcr.io/weave-hand/loom-worker
  CHART_REPO: oci://ghcr.io/weave-hand/charts

permissions:
  contents: write   # create the vX.Y.Z tag + GitHub Release (release job)
  packages: write   # push images + chart to ghcr

jobs:
  # Intentional versioned release. Run from the Actions tab with a version; tags
  # the current main images X.Y.Z + latest and cuts a vX.Y.Z git tag + Release.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags, for the clobber guard

      - name: Validate version
        id: v
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be X.Y.Z, got '$V'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "tag v$V already exists — refusing to clobber a release."; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up buck2
        uses: ./.github/actions/setup-buck2
        with:
          release: ${{ env.BUCK2_RELEASE }}

      - name: Log in to ghcr
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | buck2 run homelab//buck2/bin:crane -- auth login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Push release images
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          buck2 run deploy//images/ingest:image.push    -- "$V" latest
          buck2 run deploy//images/query-api:image.push -- "$V" latest
          buck2 run deploy//images/engine:image.push    -- "$V" latest
          buck2 run deploy//images/worker:image.push    -- "$V" latest

      - name: Guard wheel version matches pyproject
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          pv="$(grep -E '^version = ' src/sdk/python/pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "$pv" != "$V" ]; then
            echo "release version '$V' != committed pyproject version '$pv' — refusing to publish a mismatched wheel." >&2
            exit 1
          fi

      - name: Push SDK wheel + stage the Release asset
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Tie the guard to the real artifact: the wheel's version is stamped from
          # the BUCK _WHEEL_VERSION constant (kept == pyproject by :wheel-test), so
          # assert the built filename matches $V before publishing anything — this
          # catches a _WHEEL_VERSION/$V mismatch even if it slipped past the
          # pyproject guard (e.g. a release fired against a red main).
          wheel="$(buck2 build //src/sdk/python:wheel --show-simple-output)"
          want="loom_sdk-$V-py3-none-any.whl"
          if [ "$(basename "$wheel")" != "$want" ]; then
            echo "built wheel '$(basename "$wheel")' != expected '$want' — refusing to publish a mismatched wheel." >&2
            exit 1
          fi
          buck2 run deploy//sdk:wheel.push -- "$V" latest
          cp "$wheel" "$want"

      - name: Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: loom_sdk-*.whl

  # Dev-image preview on every PR commit (same-repo branches only — fork PRs get a
  # read-only token + no secrets, so they're skipped). Dev tags are SemVer
  # prereleases that sort below releases and never collide with bleeding-edge.
  dev-image:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up buck2
        uses: ./.github/actions/setup-buck2
        with:
          release: ${{ env.BUCK2_RELEASE }}

      - name: Log in to ghcr
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | buck2 run homelab//buck2/bin:crane -- auth login "$REGISTRY" -u '${{ github.actor }}' --password-stdin
          echo "$TOKEN" | buck2 run homelab//buck2/bin:helm  -- registry login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Build & push dev images + chart
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          # `sha` prefix keeps the identifier alphanumeric — an all-digit short
          # SHA with a leading zero would be an invalid SemVer numeric identifier.
          dev="0.0.0-pr${PR}.sha${short}"   # SemVer prerelease: sorts below releases
          moving="pr-${PR}"                  # updated each push for this PR

          buck2 run deploy//images/ingest:image.push    -- "$dev" "$moving"
          buck2 run deploy//images/query-api:image.push -- "$dev" "$moving"
          buck2 run deploy//images/engine:image.push    -- "$dev" "$moving"
          buck2 run deploy//images/worker:image.push    -- "$dev" "$moving"

          # Chart stamped to the dev version, digest-pinned to the dev images.
          sed -i -E "s/^version:.*/version: $dev/; s/^appVersion:.*/appVersion: \"$dev\"/" \
            deploy/chart/chart/Chart.yaml
          buck2 run deploy//chart:chart.push

          {
            echo "### loom dev images (PR #${PR})"
            echo ""
            echo "- \`${INGEST_IMAGE}:${dev}\` (also \`:${moving}\`)"
            echo "- \`${QUERY_API_IMAGE}:${dev}\` (also \`:${moving}\`)"
            echo "- \`${ENGINE_IMAGE}:${dev}\` (also \`:${moving}\`)"
            echo "- \`${WORKER_IMAGE}:${dev}\` (also \`:${moving}\`)"
            echo "- chart \`${CHART_REPO}/loom:${dev}\`"
          } >> "$GITHUB_STEP_SUMMARY"
