name: rbe-image

# Custom BuildBuddy RBE image for loom (flame-public base + chrome-headless-shell
# runtime libs), so //src/ui/e2e:login can start its vendored browser on the RE
# worker. Manual only — the image changes ~never (Chrome-major or base bump).
# After a successful run, copy the printed digest into platforms/defs.bzl's
# container-image line. See
# docs/superpowers/specs/2026-07-02-ui-e2e-hermetic-rbe-image-design.md.
on:
  workflow_dispatch:

# Serialize dispatches so two runs can't race on the :latest tag / digest read.
concurrency:
  group: rbe-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/weave-hand/loom-rbe-browser

permissions:
  contents: read
  packages: write   # push the image to ghcr

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Chrome for Testing version
        id: ver
        run: |
          set -euo pipefail
          v="$(grep -oP 'CHROME_FOR_TESTING_VERSION = "\K[^"]+' third-party/browser/BUCK)"
          echo "cft=$v" >> "$GITHUB_OUTPUT"
          echo "chrome-for-testing version: $v"

      - name: Set up QEMU (for emulated arm64 apt layer)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 and smoke-test the lib closure
        # Smoke runs the amd64 chrome-headless-shell (the browser buck vendors is
        # amd64), so we --load a single-arch amd64 image to test against. The apt
        # package list is arch-identical on arm64 Ubuntu 24.04, so the arm64
        # variant shares the same closure — no separate arm64 smoke.
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t loom-rbe-browser:ci tools/ci/rbe-browser
          tools/ci/rbe-browser/smoke.sh loom-rbe-browser:ci

      - name: Log in to ghcr
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push multi-arch (amd64 + arm64)
        id: push
        run: |
          set -euo pipefail
          cft="${{ steps.ver.outputs.cft }}"
          # Pushes a manifest-list; the amd64 layer is a buildx cache hit from the
          # smoke build above. platforms/defs.bzl pins the resulting index digest.
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:latest" -t "$IMAGE:cft-$cft" \
            --push tools/ci/rbe-browser
          digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Report the digest to pin
        run: |
          echo "### RBE browser image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this in \`platforms/defs.bzl\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker://${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
