# reindeer (https://github.com/facebookincubator/reindeer) config. Reindeer reads
# the workspace manifest below, resolves its third-party deps from Cargo.lock,
# and generates buck2 rules for them into `third-party/BUCK`. First-party crates
# (workspace members like src/hello) are skipped — their BUCK files are hand-
# written. Paths here are relative to this file's directory (the repo root).
#
# Regenerate after changing any crate's [dependencies]: `./tools/buckify.sh`.

manifest_path = "Cargo.toml"
third_party_dir = "third-party"
cargo_env = true

# Platforms reindeer evaluates target cfgs against and emits platform_deps for.
# Defining any [platform] overrides reindeer's built-in default set, so loom's
# native targets are listed explicitly alongside the wasm32 cross-compile target.
# The names match DEFAULT_REINDEER_PLATFORMS in prelude/rust/cargo_package.bzl so
# the generated select() resolves; the PACKAGE file maps loom's //platforms:wasm
# onto the "wasm32" name.
#
# execution-platform marks the host/RE platforms (true) vs the wasm target (false):
# features turned on by a build script or proc macro run on an execution platform
# and must NOT leak onto wasm, otherwise std-only deps gated `cfg(not(wasm32))`
# (e.g. tokio -> socket2) get pulled into the wasm graph and fail to compile.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = true

[platform.wasm32]
target = "wasm32-unknown-unknown"
execution-platform = false

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""
